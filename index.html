<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of a software engineer & builder — projects, experience, and things made on the web." />
    <meta name="theme-color" content="#f3ece0" />
    <script>
      // Apply saved palette before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("portfolio-theme");
          document.documentElement.dataset.theme =
            ["paper", "sand", "sage", "dusk"].indexOf(t) >= 0 ? t : "paper";
        } catch (e) {
          document.documentElement.dataset.theme = "paper";
        }
      })();
    </script>
    <meta property="og:title" content="SIGNAL — Software Engineer & Builder" />
    <meta property="og:description" content="Projects, experience, and things I've built on the web." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>SIGNAL — Software Engineer &amp; Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
